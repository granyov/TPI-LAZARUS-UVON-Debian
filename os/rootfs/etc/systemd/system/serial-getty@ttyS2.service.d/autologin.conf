# Консоль платы: автоматический вход под root. Без него при отказе сети в
# свежую систему не войти — пароль root не задан. Снимается удалением файла,
# но сначала задайте пароль root или ключ SSH.
# Первая скорость списка — та, на которой работают прошивка и ядро.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --keep-baud 1500000,115200,57600,38400,9600 %I $TERM
